services:
  - type: web
    name: alquiler-vehiculos
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx tsc -p tsconfig.build.json && cd frontend-react && npm install --include=dev && npm run build && cd ..
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autospot-db
          property: connectionString
      - key: SWAGGER_USER
        sync: false
      - key: SWAGGER_PASSWORD
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      # Integración con Booking Prototipo (contratos autos-openapi-v3 e inventory.proto)
      - key: NODE_ID
        value: NODE_AUT_AUTOSPOT
      - key: BOOKING_GRPC_HOST
        value: rda1-backend-integracion-sistemas.onrender.com:50051
      - key: BOOKING_REST_URL
        value: https://rda1-backend-integracion-sistemas.onrender.com
      - key: TIENDA_AUTOS_API_KEY
        sync: false
